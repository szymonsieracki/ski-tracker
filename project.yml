name: SkiTracker
options:
  bundleIdPrefix: com.skitracker
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SkiTracker:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skitracker.app
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Ski Tracker
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: Aplikacja zapisuje Twoją trasę podczas jazdy na nartach.
        NSLocationAlwaysAndWhenInUseUsageDescription: Aplikacja śledzi trasę w tle, także gdy telefon jest w kieszeni.
        NSMotionUsageDescription: Barometr służy do dokładnego pomiaru wysokości i rozpoznawania wyciągów.
